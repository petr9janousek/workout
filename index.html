<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111315" />
    <meta name="description" content="Log workouts and track progress, offline." />

    <!-- iPhone: open full-screen from the home screen, with our icon -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workout" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <title>Workout</title>
    <style>
      html, body { background: #111315; color: #f1f2f3; }
      #startup-error { display: none; padding: 24px 16px; font: 15px/1.45 system-ui, sans-serif; }
      #startup-error pre { white-space: pre-wrap; word-break: break-word; background: #25292d; padding: 12px; border-radius: 10px; font-size: 13px; }
    </style>
    <!--
      Safety net: phones have no developer console, so if the app fails to
      start, show the error on screen instead of a blank page.
      (Old-style JavaScript on purpose, so it runs even on old phones.)
    -->
    <script>
      (function () {
        var shown = false;
        window.showStartupError = function (err) {
          if (shown) return;
          shown = true;
          var box = document.getElementById('startup-error');
          if (!box) return;
          var text = err && (err.stack || err.message) ? (err.message + '\n\n' + (err.stack || '')) : String(err);
          box.querySelector('pre').textContent = text + '\n\nBrowser: ' + navigator.userAgent;
          box.style.display = 'block';
        };
        window.addEventListener('error', function (e) {
          window.showStartupError(e.error || (e.message + ' (' + e.filename + ':' + e.lineno + ')'));
        });
        window.addEventListener('unhandledrejection', function (e) {
          window.showStartupError(e.reason);
        });
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && !root.hasChildNodes()) {
              window.showStartupError('The app did not start within 8 seconds (no error was reported).');
            }
          }, 8000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="startup-error">
      <h2>Something went wrong</h2>
      <p>Take a screenshot of this and send it over:</p>
      <pre></pre>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
